name: Get latest Actual release

on:
  schedule:
    - cron:  '0 23 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  get-version:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Fetch release version
        run: |
          set -euo pipefail
          curl -fsSL https://api.github.com/repos/actualbudget/actual/releases/latest | \
          jq -er '.tag_name' > actual-latest.txt

      - name: Pin helper API to the release
        run: node scripts/sync-actual-version.js

      - name: Check for modified files
        id: git-check
        run: |
          if git diff --quiet -- actual-latest.txt package.json package-lock.json; then
            echo "modified=false" >> "$GITHUB_OUTPUT"
          else
            echo "modified=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit latest release version
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config user.name 'actual-helpers release updater'
          git config user.email 'actual-helpers-release-updater@users.noreply.github.com'
          git add actual-latest.txt package.json package-lock.json
          git commit -m "chore: pin Actual API to $(cat actual-latest.txt)"
          git push
