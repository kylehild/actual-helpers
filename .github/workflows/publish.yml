name: Validate and publish Actual helpers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - actual-latest.txt
      - scripts/**
      - '*.js'
      - test/**
      - .dockerignore
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helpers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check pinned runtime
        id: version
        run: |
          node scripts/sync-actual-version.js --check
          node -e 'const p=require("./package.json"); if(!p.imageRevision) process.exit(1)'
          node --check run-helper.js
          echo "tag=$(node -p 'const p=require("./package.json"); `${p.version}-r${p.imageRevision}`')" >> "$GITHUB_OUTPUT"
      - name: Test retry and compatibility wrapper
        run: npm test
      - name: Build scheduled runtime
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: docker build --target runtime --tag "ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}" .

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Read immutable image tag
        id: version
        run: echo "tag=$(node -p 'const p=require("./package.json"); `${p.version}-r${p.imageRevision}`')" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build scheduled runtime
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: docker build --target runtime --tag "ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}" .
      - name: Reject reused immutable revision
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if docker manifest inspect "ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo 'Image tag already exists; increment imageRevision.' >&2
            exit 1
          fi
      - name: Publish immutable image
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: docker push "ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}"
